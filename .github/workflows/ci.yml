name: ARIA Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Frontend: Test & Build
  frontend-ci:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AFP Mathematical Unit Tests
        run: npm test

      - name: Build Vite Production Assets
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-frontend-dist
          path: dist/
          retention-days: 7

  # 2. Backend: Spring Boot 3.2 & Java 21 Build
  backend-ci:
    name: Backend Java 21 & Maven Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Package Spring Boot Application
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # 3. Docker: Container Build Verification
  docker-verification:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aria-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Standalone Prototype Validation
  prototype-check:
    name: Standalone Prototype Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify aria-interactive-prototype.html Exists & Non-Empty
        run: |
          test -s aria-interactive-prototype.html
          echo "[OK] Standalone prototype verified."
