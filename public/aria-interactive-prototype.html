<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIA — Agentic Release Intelligence & Autonomous Mobile DevOps</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              750: '#253248',
              850: '#151f32',
              950: '#0b1120',
            },
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'Menlo', 'monospace'],
          }
        }
      }
    };
  </script>
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
    }
    html.dark {
      color-scheme: dark;
    }
    html:not(.dark) {
      color-scheme: light;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    html.dark ::-webkit-scrollbar-track {
      background: #0b1120;
    }
    html:not(.dark) ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    html:not(.dark) ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white antialiased transition-colors duration-150">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SEED DATA & CONSTANTS ---
    const DEFAULT_AFP_PARAMS = {
      baseline: 0.3,
      threshold: 0.75,
      alpha: 0.4,
      maxWeight: 1.0,
      lambda: 0.1,
    };

    const INITIAL_MODULES = [
      { id: 'mod-checkout-cart', name: 'checkout-cart', path: 'packages/checkout-cart', language: 'TypeScript/Kotlin', loc: 14200, deps: ['payment-gateway', 'analytics-sdk'], currentRisk: 0.3, baselineRisk: 0.3, cacheStatus: 'stale', cachePolicy: 'standard', testCount: 2450 },
      { id: 'mod-payment-gateway', name: 'payment-gateway', path: 'packages/payment-gateway', language: 'Kotlin/Swift', loc: 9800, deps: ['security-vault'], currentRisk: 0.3, baselineRisk: 0.3, cacheStatus: 'hit', cachePolicy: 'standard', testCount: 1820 },
      { id: 'mod-analytics-sdk', name: 'analytics-sdk', path: 'packages/analytics-sdk', language: 'TypeScript', loc: 6400, deps: [], currentRisk: 0.3, baselineRisk: 0.3, cacheStatus: 'hit', cachePolicy: 'standard', testCount: 890 },
      { id: 'mod-user-auth', name: 'user-auth', path: 'packages/user-auth', language: 'Kotlin/Swift', loc: 8100, deps: ['security-vault'], currentRisk: 0.3, baselineRisk: 0.3, cacheStatus: 'hit', cachePolicy: 'standard', testCount: 1540 },
      { id: 'mod-security-vault', name: 'security-vault', path: 'packages/security-vault', language: 'C++/Rust', loc: 4300, deps: [], currentRisk: 0.3, baselineRisk: 0.3, cacheStatus: 'hit', cachePolicy: 'standard', testCount: 940 },
      { id: 'mod-catalog-browse', name: 'catalog-browse', path: 'packages/catalog-browse', language: 'React Native', loc: 18500, deps: ['analytics-sdk'], currentRisk: 0.3, baselineRisk: 0.3, cacheStatus: 'hit', cachePolicy: 'standard', testCount: 4700 },
    ];

    const INITIAL_INCIDENTS = [
      {
        id: 'INC-7402',
        title: 'Checkout Payment Recalculation Failure Spikes at 50% Rollout',
        severity: 'critical',
        release: 'v3.2.1-rc4',
        implicatedModule: 'checkout-cart',
        moduleId: 'mod-checkout-cart',
        confidence: 0.87,
        scenarioType: 'stale_cache_failure',
        status: 'investigating',
        detectedAt: '2026-10-21 19:08:42',
        afpSent: false,
        hypotheses: [
          { desc: 'Stale build cache reused across cart serialization schema migration', conf: 0.87, primary: true, evidence: ['Commit #7a9e4f2 altered CartItem schema with non-optional couponMetadata field', 'BIA build report indicated cache HIT on module checkout-cart', 'HTTP 502 deserialization errors matched mutated schema hash'] },
          { desc: 'Payment Gateway upstream webhook rate limiting during flash-sale surge', conf: 0.22, primary: false, evidence: ['Payment gateway latency was nominal (142ms)', 'Zero upstream 429 status codes recorded'] }
        ],
        logs: [
          '2026-10-21T19:08:12.451Z [FATAL] [checkout-cart] DeserializationError: missing field couponMetadata in CartItemState',
          '2026-10-21T19:08:12.890Z [ERROR] [checkout-cart] CartPersistenceWorker: corrupted parcel schema detected (expected v14, got v13)',
          '2026-10-21T19:08:14.102Z [WARN]  [payment-gateway] Aborting charge authorization for invalid cart session 0x8f192b'
        ]
      },
      {
        id: 'INC-7395',
        title: 'Background Auth Token Refresh Timeout on Cold Boot',
        severity: 'major',
        release: 'v3.2.0',
        implicatedModule: 'user-auth',
        moduleId: 'mod-user-auth',
        confidence: 0.81,
        scenarioType: 'missing_regression_test',
        status: 'resolved',
        detectedAt: '2026-10-12 14:02:10',
        afpSent: true,
        hypotheses: [{ desc: 'Missing regression test for Android 14 pending intent flags', conf: 0.81, primary: true, evidence: ['NullPointerException in NotificationTrampolineActivity'] }],
        logs: ['2026-10-12T14:03:00Z [CRITICAL] [user-auth] java.lang.SecurityException: FLAG_IMMUTABLE required']
      }
    ];

    const INITIAL_APPROVALS = [
      { id: 'appr-01', title: 'Level 4 Rollback: Roll back v3.2.1 rollout from 50% to stable v3.2.0', actionType: 'ROLLBACK', requestedBy: 'DCA', requestedAt: '2026-10-21 19:11:00', rationale: 'Checkout failure rate (7.8%) exceeds safety threshold (3.0%). High customer checkout failure impact.', confidence: 0.93, level: 4, status: 'pending' },
      { id: 'appr-02', title: 'Level 4 Broad Cache Invalidation: Purge Gradle/Bazel build cache across Tier-1 modules', actionType: 'BROAD_CACHE_INVALIDATION', requestedBy: 'BIA', requestedAt: '2026-10-21 19:16:30', rationale: 'Prevent subsequent builds from inheriting stale checkout-cart or payment-gateway serialized schemas.', confidence: 0.89, level: 4, status: 'pending' }
    ];

    const INITIAL_AUDIT = [
      { id: 'aud-1', time: '2026-10-21 14:22:15', cat: 'BUILD', action: 'Commit #7a9e4f2 Received', agent: 'SYSTEM', sev: 'info', lvl: 1, details: 'Elena Vance: Cart state sync and coupon recalculation' },
      { id: 'aud-2', time: '2026-10-21 14:28:40', cat: 'BUILD', action: 'BIA Reused Build Cache', agent: 'BIA', sev: 'notice', lvl: 2, details: 'Cache hit reused for checkout-cart (85.7% hit rate)' },
      { id: 'aud-3', time: '2026-10-21 14:35:10', cat: 'TEST_SELECTION', action: 'COA Selected 847 Tests', agent: 'COA', sev: 'info', lvl: 2, details: 'Selected 847 of 12,340 tests based on baseline risk (0.30)' },
      { id: 'aud-4', time: '2026-10-21 15:30:00', cat: 'RELEASE', action: 'RCA Approved Release v3.2.1', agent: 'RCA', sev: 'info', lvl: 2, details: 'All 4 gating criteria passed (Simulated Artifact Signed)' },
      { id: 'aud-5', time: '2026-10-21 18:45:00', cat: 'DEPLOYMENT', action: 'DCA Advanced Rollout to 50%', agent: 'DCA', sev: 'notice', lvl: 2, details: '1.1M active users reached' },
      { id: 'aud-6', time: '2026-10-21 19:10:00', cat: 'DEPLOYMENT', action: 'DCA Paused Rollout (Anomaly)', agent: 'DCA', sev: 'alert', lvl: 4, details: 'Checkout HTTP error spiked to 7.8%' },
      { id: 'aud-7', time: '2026-10-21 19:12:30', cat: 'INCIDENT', action: 'IRA Triaged INC-7402', agent: 'IRA', sev: 'alert', lvl: 2, details: 'Stale cache in checkout-cart identified (c=0.87)' }
    ];

    // --- APP ROOT COMPONENT ---
    function App() {
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('aria_mobile_devops_state_v1_theme');
        if (saved === 'light' || saved === 'dark') return saved;
        if (typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          return 'light';
        }
        return 'dark';
      });

      useEffect(() => {
        localStorage.setItem('aria_mobile_devops_state_v1_theme', theme);
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      }, [theme]);

      const [page, setPage] = useState('overview');
      const [modules, setModules] = useState(() => {
        const saved = localStorage.getItem('aria_modules');
        return saved ? JSON.parse(saved) : INITIAL_MODULES;
      });
      const [incidents, setIncidents] = useState(() => {
        const saved = localStorage.getItem('aria_incidents');
        return saved ? JSON.parse(saved) : INITIAL_INCIDENTS;
      });
      const [approvals, setApprovals] = useState(() => {
        const saved = localStorage.getItem('aria_approvals');
        return saved ? JSON.parse(saved) : INITIAL_APPROVALS;
      });
      const [auditEvents, setAuditEvents] = useState(() => {
        const saved = localStorage.getItem('aria_audit');
        return saved ? JSON.parse(saved) : INITIAL_AUDIT;
      });
      const [subsequentTestCount, setSubsequentTestCount] = useState(() => {
        const saved = localStorage.getItem('aria_test_count');
        return saved ? JSON.parse(saved) : 847;
      });
      const [deploymentStage, setDeploymentStage] = useState(50);
      const [deploymentStatus, setDeploymentStatus] = useState('in_progress');
      const [demoModalOpen, setDemoModalOpen] = useState(false);
      const [demoStep, setDemoStep] = useState(1);
      const [notification, setNotification] = useState(null);

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('aria_modules', JSON.stringify(modules));
        localStorage.setItem('aria_incidents', JSON.stringify(incidents));
        localStorage.setItem('aria_approvals', JSON.stringify(approvals));
        localStorage.setItem('aria_audit', JSON.stringify(auditEvents));
        localStorage.setItem('aria_test_count', JSON.stringify(subsequentTestCount));
      }, [modules, incidents, approvals, auditEvents, subsequentTestCount]);

      const showNotify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 6000);
      };

      const addAudit = (cat, action, agent, sev, lvl, details) => {
        const entry = {
          id: 'aud-' + Date.now(),
          time: new Date().toISOString().replace('T', ' ').substring(0, 19),
          cat, action, agent, sev, lvl, details
        };
        setAuditEvents(prev => [entry, ...prev]);
      };

      // AFP INCIDENT SIGNAL DISPATCH
      const sendAfpSignal = (incidentId) => {
        const inc = incidents.find(i => i.id === incidentId);
        if (!inc) return;
        if (inc.afpSent) {
          showNotify('AFP signal already processed for ' + inc.id);
          return;
        }

        // Gating Check: c >= 0.75
        if (inc.confidence < 0.75) {
          addAudit('AFP', 'AFP-INCIDENT Rejected', 'IRA', 'warning', 3, 'Confidence ' + inc.confidence + ' < 0.75 threshold. Gated.');
          showNotify('AFP Gating Rejected: Confidence ' + inc.confidence + ' is below 0.75 threshold.');
          return;
        }

        // Compute new weight: min(1.0, current + c * 0.4)
        const targetMod = modules.find(m => m.id === inc.moduleId);
        const prevW = targetMod ? targetMod.currentRisk : 0.3;
        const newW = Number(Math.min(1.0, prevW + inc.confidence * 0.4).toFixed(3)); // 0.3 + 0.87*0.4 = 0.648

        // Update module
        setModules(prev => prev.map(m => m.id === inc.moduleId ? { ...m, currentRisk: newW, cachePolicy: 'strict_invalidation' } : m));
        setIncidents(prev => prev.map(i => i.id === incidentId ? { ...i, afpSent: true, status: 'mitigating' } : i));
        setSubsequentTestCount(1334); // Expanded suite!

        addAudit('AFP', 'AFP-INCIDENT Signal Dispatched', 'IRA', 'notice', 3, 'Updated ' + inc.implicatedModule + ' risk ' + prevW + ' -> ' + newW + ' (c=' + inc.confidence + ')');
        addAudit('AFP', 'AFP-ACK Acknowledged', 'BIA', 'info', 3, 'Enforced strict cache invalidation; expanded CI tests to 1,334');

        showNotify('AFP update accepted: checkout-cart risk increased from ' + prevW + ' to ' + newW + '. Test suite expanded to 1,334 tests.');
      };

      // EXPONENTIAL DECAY SIMULATION
      const applyDecay = (days) => {
        setModules(prev => prev.map(m => {
          if (m.currentRisk <= m.baselineRisk) return m;
          const excess = m.currentRisk - m.baselineRisk;
          const decayedExcess = excess * Math.exp(-0.1 * days);
          const newRisk = Number(Math.max(m.baselineRisk, m.baselineRisk + decayedExcess).toFixed(3));
          return {
            ...m,
            currentRisk: newRisk,
            cachePolicy: newRisk > 0.5 ? 'strict_invalidation' : 'standard'
          };
        }));
        if (days >= 30) {
          setSubsequentTestCount(847);
        }
        addAudit('AFP', 'AFP-DECAY Applied', 'ORCHESTRATOR', 'info', 1, 'Decayed risk across modules for ' + days + ' incident-free days.');
        showNotify('Simulated ' + days + ' days of incident-free operation. Risk weights decayed.');
      };

      // APPROVALS
      const handleApproval = (id, decision) => {
        setApprovals(prev => prev.map(a => a.id === id ? { ...a, status: decision, resolvedBy: 'Raj Ratan (DevOps Lead)', resolvedAt: new Date().toISOString().replace('T', ' ').substring(0, 19) } : a));
        if (id === 'appr-01' && decision === 'approved') {
          setDeploymentStatus('rolled_back');
          setDeploymentStage(0);
          addAudit('GOVERNANCE', 'Rollback Executed', 'HUMAN', 'alert', 4, 'Rollback to v3.2.0 authorized by Raj Ratan');
          showNotify('Rollback to v3.2.0 authorized and executed.');
        } else {
          addAudit('GOVERNANCE', 'Approval Decision: ' + decision, 'HUMAN', 'info', 4, 'Approval ' + id + ' set to ' + decision);
          showNotify('Approval request ' + id + ' ' + decision);
        }
      };

      const resetAll = () => {
        localStorage.clear();
        setModules(INITIAL_MODULES);
        setIncidents(INITIAL_INCIDENTS);
        setApprovals(INITIAL_APPROVALS);
        setAuditEvents(INITIAL_AUDIT);
        setSubsequentTestCount(847);
        setDeploymentStage(50);
        setDeploymentStatus('in_progress');
        setDemoStep(1);
        showNotify('Prototype state reset to baseline.');
      };

      const cartMod = modules.find(m => m.id === 'mod-checkout-cart');
      const isAfpElevated = cartMod ? cartMod.currentRisk > 0.3 : false;
      const pendingApprCount = approvals.filter(a => a.status === 'pending').length;

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          {/* SIDEBAR */}
          <aside className="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between p-4 flex-shrink-0 z-20 shadow-sm">
            <div>
              <div className="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-200 dark:border-slate-800">
                <div className="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-base shadow-sm">
                  A
                </div>
                <div>
                  <div className="font-bold tracking-tight text-slate-900 dark:text-slate-100 flex items-center gap-1.5 text-sm">
                    ARIA
                    <span className="text-[10px] px-1.5 py-0.2 bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300 border border-blue-200 dark:border-blue-800 rounded font-mono font-medium">v1.0</span>
                  </div>
                  <div className="text-[10px] text-slate-500 dark:text-slate-400">Mobile DevOps Intelligence</div>
                </div>
              </div>

              <nav className="space-y-1 text-xs font-medium">
                {[
                  { id: 'overview', label: 'Overview Dashboard', icon: '📊' },
                  { id: 'agents', label: '5-Agent Control Center', icon: '🤖' },
                  { id: 'builds', label: 'Build Intelligence', icon: '🔨' },
                  { id: 'ci-tests', label: 'CI & Test Selection', icon: '🧪' },
                  { id: 'releases', label: 'Release & Rollout', icon: '🚀' },
                  { id: 'incidents', label: 'Incident Intelligence', icon: '⚠️', badge: incidents.filter(i=>!i.resolvedAt).length },
                  { id: 'afp', label: 'AFP Protocol Engine', icon: '⚡', highlight: isAfpElevated },
                  { id: 'governance', label: 'Governance & Approvals', icon: '🛡️', badge: pendingApprCount, badgeColor: 'bg-amber-600' },
                  { id: 'audit', label: 'Immutable Audit Log', icon: '📜' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setPage(item.id)}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg transition-colors ${
                      page === item.id
                        ? 'bg-blue-50 text-blue-700 border border-blue-200 dark:bg-blue-950 dark:text-blue-300 dark:border-blue-800 font-semibold'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800/60'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      <span>{item.icon}</span>
                      <span>{item.label}</span>
                    </div>
                    {item.badge > 0 && (
                      <span className={`${item.badgeColor || 'bg-rose-600'} text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3 rounded-lg bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800 text-xs">
              <div className="text-slate-500 dark:text-slate-400 font-mono text-[11px] mb-1">Target: Mobile SuperApp</div>
              <div className="text-[10px] text-slate-500 dark:text-slate-400">Closed Loop: <span className="text-emerald-600 dark:text-emerald-400 font-bold">Active</span></div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* TOP HEADER BAR */}
            <header className="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur px-6 flex items-center justify-between flex-shrink-0 z-10 shadow-sm">
              <div className="flex items-center gap-3">
                <span className="text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-semibold">
                  📱 RetailGo Mobile (release/v3.2.1)
                </span>
                <span className="hidden sm:inline-flex text-[11px] px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 dark:bg-blue-950 dark:text-blue-300 dark:border-blue-800 font-medium">
                  Autonomy Level 3 (Bounded Active)
                </span>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden md:flex items-center gap-2 px-3 py-1 rounded-lg bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800 text-xs font-mono">
                  <span className="text-slate-500 dark:text-slate-400">checkout-cart Risk:</span>
                  <span className={`font-bold ${isAfpElevated ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400'}`}>
                    {cartMod ? cartMod.currentRisk.toFixed(3) : '0.300'}
                  </span>
                </div>

                {/* Theme Mode Toggle Button */}
                <button
                  onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-medium transition-colors shadow-sm"
                  title={theme === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme'}
                >
                  {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                </button>

                <button
                  onClick={() => setDemoModalOpen(true)}
                  className="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm transition-colors"
                >
                  ▶ Run Demo Scenario
                </button>

                <button
                  onClick={() => { if (confirm('Reset prototype scenario to baseline?')) resetAll(); }}
                  className="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs border border-slate-200 dark:border-slate-700 font-medium transition-colors"
                >
                  🔄 Reset
                </button>
              </div>
            </header>

            {/* NOTIFICATION TOAST */}
            {notification && (
              <div className="bg-blue-50 dark:bg-blue-950 border-b border-blue-200 dark:border-blue-800 px-6 py-2.5 text-xs text-blue-800 dark:text-blue-200 flex items-center justify-between">
                <span>⚡ {notification}</span>
                <button onClick={() => setNotification(null)} className="text-blue-700 dark:text-blue-400 font-bold ml-4">✕</button>
              </div>
            )}

            {/* SCROLLABLE BODY */}
            <main className="flex-1 overflow-y-auto p-6 space-y-6">
              {/* PAGE ROUTING */}
              {page === 'overview' && (
                <OverviewView
                  modules={modules}
                  incidents={incidents}
                  approvals={approvals}
                  subsequentTestCount={subsequentTestCount}
                  deploymentStage={deploymentStage}
                  deploymentStatus={deploymentStatus}
                  isAfpElevated={isAfpElevated}
                  setPage={setPage}
                />
              )}

              {page === 'agents' && <AgentsView modules={modules} subsequentTestCount={subsequentTestCount} />}
              {page === 'builds' && <BuildsView modules={modules} />}
              {page === 'ci-tests' && <CiTestsView modules={modules} subsequentTestCount={subsequentTestCount} isAfpElevated={isAfpElevated} />}
              {page === 'releases' && (
                <ReleasesView
                  stage={deploymentStage}
                  status={deploymentStatus}
                  onAdvance={() => setDeploymentStage(prev => prev < 100 ? (prev === 2 ? 10 : prev === 10 ? 50 : 100) : 100)}
                  onPause={() => setDeploymentStatus('paused')}
                  onRequestRollback={() => {
                    handleApproval('appr-01', 'pending');
                    setPage('governance');
                    showNotify('Level 4 Rollback request created! Authorize in Governance queue.');
                  }}
                />
              )}
              {page === 'incidents' && (
                <IncidentsView
                  incidents={incidents}
                  onSendAfp={sendAfpSignal}
                />
              )}
              {page === 'afp' && (
                <AfpView
                  modules={modules}

    function AfpView({ modules, onSendAfp, onDecay, subsequentTestCount, isAfpElevated }) {

      const accepted = calcC >= 0.75;
      const updatedW = accepted ? Number(Math.min(1.0, calcW + calcC * 0.4).toFixed(3)) : calcW;
      const decayedW = Number(Math.max(0.3, 0.3 + (updatedW - 0.3) * Math.exp(-0.1 * calcDays)).toFixed(3));

      const cart = modules.find(m => m.id === 'mod-checkout-cart');

              </div>
              <div>
                <label className="text-slate-600 dark:text-slate-400 block mb-1 font-medium">Confidence (c &ge; 0.75):</label>

              </div>
            </div>

            </div>

            <div className="flex gap-3 mt-4 pt-3 border-t border-slate-200 dark:border-slate-800">
              <button onClick={() => onSendAfp('INC-7402')} className="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm transition-colors">
                ⚡ Apply INC-7402 Update (0.3 &rarr; 0.648)
              </button>
              <button onClick={() => onDecay(7)} className="px-3.5 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-xs font-medium transition-colors">
                Simulate 7 Days Decay
              </button>
            </div>
          </div>

          {/* Monte Carlo Decay Horizon & Escape Hazard Table */}
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
            <h2 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200 mb-1">
              Monte Carlo Decay Horizon & Escape Hazard Forecast
            </h2>
            <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">
              Deterministic decay w(t) = w_baseline + (w0 - w_baseline)e^(-λt) with regression hazard rates:
            </p>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-mono">
                <thead>
                  <tr className="border-b border-slate-200 dark:border-slate-800 text-[10px] text-slate-400 uppercase">
                    <th className="py-2 px-3">Horizon</th>
                    <th className="py-2 px-3">Expected Risk w(t)</th>
                    <th className="py-2 px-3">Active CI Tests</th>
                    <th className="py-2 px-3">Escape Hazard</th>
                    <th className="py-2 px-3">Cache Invalidation Policy</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {[
                    { d: 'Day 0', w: updatedW, t: isAfpElevated ? 1334 : 847, h: isAfpElevated ? '0.08%' : '0.72%', p: isAfpElevated ? 'strict_invalidation' : 'standard' },
                    { d: 'Day 7', w: (0.3 + (updatedW - 0.3) * Math.exp(-0.7)).toFixed(3), t: Math.round(847 + ((0.3 + (updatedW - 0.3) * Math.exp(-0.7) - 0.3)/(updatedW - 0.3 || 1)) * 487), h: '0.24%', p: 'strict_invalidation' },
                    { d: 'Day 14', w: (0.3 + (updatedW - 0.3) * Math.exp(-1.4)).toFixed(3), t: Math.round(847 + ((0.3 + (updatedW - 0.3) * Math.exp(-1.4) - 0.3)/(updatedW - 0.3 || 1)) * 487), h: '0.42%', p: 'standard' },
                    { d: 'Day 30', w: (0.3 + (updatedW - 0.3) * Math.exp(-3.0)).toFixed(3), t: 868, h: '0.68%', p: 'standard' },
                    { d: 'Day 60', w: '0.300', t: 847, h: '0.72%', p: 'standard' }
                  ].map((row, idx) => (
                    <tr key={idx} className="hover:bg-slate-50/50 dark:hover:bg-slate-850/50">
                      <td className="py-2.5 px-3 font-bold text-slate-900 dark:text-slate-100">{row.d}</td>
                      <td className={`py-2.5 px-3 font-bold ${parseFloat(row.w) > 0.4 ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400'}`}>{row.w}</td>
                      <td className="py-2.5 px-3">{row.t} tests</td>
                      <td className="py-2.5 px-3"><span className="px-2 py-0.5 rounded text-[10px] bg-slate-100 dark:bg-slate-800">{row.h}</span></td>
                      <td className="py-2.5 px-3"><span className="text-[10px] px-2 py-0.5 rounded bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300 font-mono">{row.p}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
            <h2 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200 mb-4">Upstream Closed-Loop Impact</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
              <div className="p-4 rounded-lg bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800">
                <span className="font-bold text-slate-800 dark:text-slate-200 block mb-2">Baseline Commit (Pre-Feedback)</span>
                <div className="space-y-1 font-mono text-slate-500 dark:text-slate-400">
                  <div>checkout-cart Risk: 0.300</div>
                  <div>Cache Policy: standard</div>
                  <div>CI Selected Tests: 847 tests</div>
                  <div>Cart Regression Suite: Pruned</div>
                </div>
              </div>

              <div className={`p-4 rounded-lg border ${isAfpElevated ? 'bg-blue-50/70 border-blue-500 dark:bg-slate-850 dark:border-blue-600 ring-1 ring-blue-500/30' : 'bg-slate-50/50 dark:bg-slate-850 border-slate-200 dark:border-slate-800 opacity-60'}`}>
                <span className="font-bold text-blue-800 dark:text-blue-300 block mb-2">Subsequent Commit (Post-AFP Feedback)</span>
                <div className="space-y-1 font-mono text-slate-700 dark:text-slate-300">
                  <div>checkout-cart Risk: <strong className="text-rose-600 dark:text-rose-400">{cart ? cart.currentRisk.toFixed(3) : '0.648'}</strong></div>
                  <div>Cache Policy: <strong className="text-blue-700 dark:text-blue-400">strict_invalidation</strong></div>
                  <div>CI Selected Tests: <strong className="text-emerald-600 dark:text-emerald-400">{subsequentTestCount} tests (+487 tests)</strong></div>
                  <div>Cart Regression Suite: <strong className="text-emerald-600 dark:text-emerald-400">Mandatory Active</strong></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- GOVERNANCE VIEW ---
    function GovernanceView({ approvals, onResolve }) {
      const pending = approvals.filter(a => a.status === 'pending');
      const resolved = approvals.filter(a => a.status !== 'pending');

      return (
        <div className="space-y-6">
          <div className="pb-2 border-b border-slate-200 dark:border-slate-800">
            <h1 className="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Governance & Autonomy Gatekeeping</h1>
            <p className="text-xs text-slate-500 dark:text-slate-400">Level 4 Human-in-the-loop authorization queue for high-impact actions</p>
          </div>

          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
            <h2 className="text-xs font-bold uppercase tracking-wider text-amber-800 dark:text-amber-300 mb-3">
              Pending Level 4 Approval Queue ({pending.length})
            </h2>

            {pending.length === 0 ? (
              <div className="text-xs text-slate-500 py-6 text-center">No pending approval requests.</div>
            ) : (
              <div className="space-y-3">
                {pending.map(appr => (
                  <div key={appr.id} className="p-4 rounded-xl border border-amber-200 bg-amber-50/50 dark:border-amber-900/60 dark:bg-amber-950/20 text-xs space-y-2">
                    <div className="flex justify-between font-mono font-bold text-amber-700 dark:text-amber-300">
                      <span>{appr.id} &bull; {appr.actionType}</span>
                      <span>Requested by: {appr.requestedBy}</span>
                    </div>
                    <div className="font-bold text-slate-900 dark:text-slate-100">{appr.title}</div>
                    <p className="text-slate-700 dark:text-slate-300">{appr.rationale}</p>
                    <div className="flex gap-2 pt-2">
                      <button onClick={() => onResolve(appr.id, 'approved')} className="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow-sm transition-colors">
                        ✓ Authorize Execution
                      </button>
                      <button onClick={() => onResolve(appr.id, 'rejected')} className="px-3.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 dark:bg-rose-950 dark:hover:bg-rose-900 dark:text-rose-300 dark:border-rose-800 text-xs font-semibold transition-colors">
                        ✕ Reject
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
            <h2 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200 mb-3">Resolved Approvals History</h2>
            {resolved.length === 0 ? (
              <div className="text-xs text-slate-500 py-4 text-center">No resolved approvals yet.</div>
            ) : (
              <div className="space-y-2 text-xs">
                {resolved.map(a => (
                  <div key={a.id} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800 flex justify-between">
                    <div>
                      <span className="font-mono font-bold text-slate-900 dark:text-slate-100">{a.id} ({a.actionType})</span>
                      <span className={`ml-2 px-2 py-0.5 rounded text-[10px] font-bold ${a.status === 'approved' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-400' : 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-400'}`}>{a.status}</span>
                      <div className="text-slate-500 dark:text-slate-400 text-[11px] mt-0.5">{a.title}</div>
                    </div>
                    <div className="text-right font-mono text-[11px] text-slate-500 dark:text-slate-400">
                      <div className="text-blue-700 dark:text-blue-400">{a.resolvedBy}</div>
                      <div>{a.resolvedAt}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- AUDIT VIEW ---
    function AuditView({ auditEvents }) {
      const [isVerifying, setIsVerifying] = useState(false);
      const [chainValid, setChainValid] = useState(null);

      const verifyChain = () => {
        setIsVerifying(true);
        setTimeout(() => {
          setIsVerifying(false);
          setChainValid(true);
        }, 350);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-200 dark:border-slate-800">
            <div>
              <h1 className="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Immutable Audit Trail</h1>
              <p className="text-xs text-slate-500 dark:text-slate-400">Chronological, cryptographically verifiable log of all agent decisions and state changes</p>
            </div>

            <button
              onClick={verifyChain}
              disabled={isVerifying}
              className="px-3.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-800 text-xs font-semibold shadow-sm transition-colors"
            >
              {isVerifying ? 'Verifying Chain...' : '🛡️ Verify Cryptographic Chain'}
            </button>
          </div>

          {chainValid && (
            <div className="p-3.5 rounded-xl bg-emerald-50 dark:bg-emerald-950 border border-emerald-200 dark:border-emerald-800 text-xs text-emerald-900 dark:text-emerald-200 flex justify-between items-center shadow-sm">
              <span><strong>Cryptographic Merkle Hash Chain Verified:</strong> All {auditEvents.length} events maintain valid parent-child SHA-256 hash integrity.</span>
              <span className="font-mono text-[10px] px-2 py-0.5 rounded bg-emerald-200 dark:bg-emerald-900 font-bold uppercase">LEDGER VALID</span>
            </div>
          )}

          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
            <div className="space-y-2.5 text-xs font-mono">
              {auditEvents.map((e, idx) => (
                <div key={e.id} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800 flex justify-between items-start">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-blue-700 dark:text-blue-400 font-bold">{e.cat}</span>
                      <span className="text-slate-900 dark:text-slate-100 font-semibold">{e.action}</span>
                      <span className="text-[10px] px-1.5 py-0.2 rounded bg-slate-200 dark:bg-slate-950 text-slate-600 dark:text-slate-400">{e.agent}</span>
                      <span className="text-[9px] px-1.5 py-0.2 rounded bg-slate-100 dark:bg-slate-800 text-slate-500">SHA-256 #{idx}</span>
                    </div>
                    <div className="text-slate-600 dark:text-slate-400 text-[11px] font-sans">{e.details}</div>
                  </div>
                  <div className="text-slate-400 dark:text-slate-500 text-[10px] flex-shrink-0 ml-4">{e.time}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- GUIDED DEMO MODAL ---
    function DemoModal({ step, onSetStep, onClose, onSendAfp, onReset, isAfpElevated, subsequentTestCount, modules }) {
      const steps = [
        { num: 1, title: 'Commit Trigger & Multi-Module Impact', agent: 'Developer Commit #7a9e4f2', desc: 'Commit touched 3 modules: checkout-cart, payment-gateway, analytics-sdk. ARIA evaluates dependency graph.' },
        { num: 2, title: 'Build Intelligence: Cache Reuse', agent: 'BIA Agent', desc: 'BIA evaluates cache and recommends reusing cached checkout-cart artifact (85.7% cache hit rate), saving 6.4 minutes.' },
        { num: 3, title: 'CI Orchestration: Targeted Test Selection', agent: 'COA Agent', desc: 'COA selects 847 tests from 12,340 suite using baseline risk weight (0.30), pruning untouched regression suites.' },
        { num: 4, title: 'Staged Rollout Progression', agent: 'DCA Agent', desc: 'Release v3.2.1 advances through 2% and 10% rollout stages safely with 220,000 active users.' },
        { num: 5, title: 'Runtime Anomaly Detected', agent: 'DCA / Telemetry', desc: 'At 50% rollout (1.1M users), checkout HTTP failure rate spikes from 3.2% to 7.8% due to cached schema incompatibility.' },
        { num: 6, title: 'Root-Cause Attribution & Gating Check', agent: 'IRA Agent', desc: 'IRA correlates logs to checkout-cart with confidence 0.87. Confidence 0.87 satisfies the strict AFP threshold (>= 0.75).' },
        { num: 7, title: 'ARIA Feedback Protocol (AFP) Weight Update', agent: 'AFP Protocol Engine', desc: 'AFP updates checkout-cart risk: min(1.0, 0.3 + 0.87 * 0.4) = 0.648. BIA switches cache policy to strict_invalidation.' },
        { num: 8, title: 'Upstream Influence: CI Suite Automatically Expanded', agent: 'COA & Closed Feedback Loop', desc: 'Subsequent commit automatically selects 1,334 tests (+487 cart regression tests), preventing repeated regressions.' },
      ];

      const cur = steps[step - 1];

      const next = () => {
        if (step === 6) {
          onSendAfp('INC-7402');
        }
        if (step < 8) {
          onSetStep(step + 1);
        } else {
          onClose();
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-sm">
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 max-w-xl w-full shadow-xl space-y-4">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-800">
              <div>
                <h3 className="font-bold text-slate-900 dark:text-slate-100 text-base">ARIA Guided Demo Walkthrough</h3>
                <span className="text-xs text-blue-700 dark:text-blue-400 font-mono font-medium">Step {step} of 8</span>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">✕</button>
            </div>

            <div className="p-4 rounded-lg bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800 space-y-2">
              <span className="text-[10px] px-2 py-0.5 rounded bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300 border border-blue-200 dark:border-blue-800 font-mono font-medium">{cur.agent}</span>
              <h4 className="font-bold text-slate-900 dark:text-slate-100 text-sm">{cur.title}</h4>
              <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">{cur.desc}</p>
            </div>

            <div className="flex justify-between items-center pt-3 border-t border-slate-200 dark:border-slate-800">
              <button onClick={onReset} className="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-medium">🔄 Reset</button>
              <div className="flex gap-2">
                {step > 1 && <button onClick={() => onSetStep(step - 1)} className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-medium">Back</button>}
                <button onClick={next} className="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm transition-colors">
                  {step === 8 ? 'Finish Demo' : 'Execute & Next →'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
